<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catropolis 🐾 (Idle City Builder)</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 0; background:#0b1220; color:#e8eefc; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
    .top { display:flex; gap:12px; flex-wrap:wrap; align-items:stretch; }
    .card { background:#111a2e; border:1px solid #223055; border-radius:16px; padding:14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .stats { display:flex; gap:12px; flex: 1; }
    .stat { flex:1; min-width: 150px; }
    .stat h3 { margin:0 0 6px; font-size: 14px; color:#a8b6df; font-weight: 600; }
    .stat .v { font-size: 22px; font-weight: 800; letter-spacing:.2px; }
    .row { display:grid; grid-template-columns: 1.2fr .8fr; gap: 12px; margin-top: 12px; }
    @media (max-width: 860px){ .row{ grid-template-columns: 1fr; } }
    .buildings { display:grid; gap:10px; }
    .b { display:flex; gap:10px; align-items:center; justify-content:space-between; padding:12px; border-radius:14px; border:1px solid #223055; background:#0e1730; }
    .b .left { display:flex; flex-direction:column; gap:4px; }
    .b .name { font-weight: 800; }
    .b .desc { color:#a8b6df; font-size: 13px; }
    .b .meta { color:#92a4d6; font-size: 12px; }
    button {
      cursor:pointer; border:0; border-radius: 12px; padding:10px 12px;
      background:#5b7cfa; color:white; font-weight:800;
    }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .ghost { background:#223055; }
    .progress { height:10px; background:#0b1220; border:1px solid #223055; border-radius: 999px; overflow:hidden; }
    .bar { height:100%; width:0%; background:#4fe3b1; transition: width .2s linear; }
    .log { color:#a8b6df; font-size: 13px; line-height: 1.5; max-height: 220px; overflow:auto; }
    .tiny { font-size:12px; color:#92a4d6; }
    .title { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .title h1 { margin:0; font-size: 18px; }
    .pill { font-size: 12px; padding: 6px 10px; border-radius: 999px; border:1px solid #223055; color:#a8b6df; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="title">
    <h1>Catropolis 🐾 เมืองแมว (กดแล้วรอ)</h1>
    <div class="pill" id="ratePill">รายได้: -</div>
  </div>

  <div class="top">
    <div class="card stats">
      <div class="stat">
        <h3>🐟 Fish</h3>
        <div class="v" id="fish">0</div>
        <div class="tiny" id="fishRate">+0 / วิ</div>
      </div>
      <div class="stat">
        <h3>🧶 Yarn</h3>
        <div class="v" id="yarn">0</div>
        <div class="tiny" id="yarnRate">+0 / วิ</div>
      </div>
      <div class="stat">
        <h3>🐾 Catizens</h3>
        <div class="v" id="cats">0</div>
        <div class="tiny">ใช้ปลดล็อก/อาคารบางอย่าง</div>
      </div>
      <div class="stat">
        <h3>⭐ PurrPoints</h3>
        <div class="v" id="pp">0</div>
        <div class="tiny">เลเวลเมืองแมว</div>
      </div>
    </div>

    <div class="card" style="min-width:260px;">
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="ghost" id="collectBtn">กดเก็บของสะสม 🎒</button>
        <button class="ghost" id="resetBtn">รีเซ็ต</button>
      </div>
      <div style="margin-top:12px;">
        <div class="tiny">การเก็บ: ถ้ามี “ผลผลิตรอเก็บ” จะได้ทันที</div>
        <div style="margin-top:10px;" class="progress"><div id="globalBar" class="bar"></div></div>
        <div class="tiny" id="globalProg" style="margin-top:6px;">-</div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <h2 style="margin:0 0 10px; font-size:16px;">🏗️ อาคาร</h2>
      <div class="buildings" id="buildingList"></div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 10px; font-size:16px;">📜 Log เมือง</h2>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div class="tiny" style="margin-top:12px;">
    เซฟอัตโนมัติในเครื่อง (localStorage) • เล่นได้แม้ไม่มีเน็ต
  </div>
</div>

<script>
(() => {
  // ---------- Data ----------
  const now = () => Date.now();

  const BUILDINGS = [
    {
      id: "pond",
      name: "Fish Pond 🐟",
      desc: "บ่อปลาเริ่มต้นของเมือง",
      buildTimeSec: 10,
      cost: { fish: 0, yarn: 0, cats: 0, pp: 0 },
      unlock: (s) => true,
      onBuilt: (s) => { s.rates.fish += 1; },
      meta: "ผลิตปลา +1/วิ (ถาวร)"
    },
    {
      id: "house",
      name: "Cat House 🏠",
      desc: "บ้านแมว เพิ่มประชากร",
      buildTimeSec: 15,
      cost: { fish: 20, yarn: 0, cats: 0, pp: 0 },
      unlock: (s) => s.buildings.pond?.built >= 1,
      onBuilt: (s) => { s.cats += 2; s.pp += 1; },
      meta: "+2 Catizens, +1 PurrPoint"
    },
    {
      id: "mill",
      name: "Yarn Mill 🧶",
      desc: "โรงงานไหมพรม ใช้แรงงานแมว",
      buildTimeSec: 20,
      cost: { fish: 40, yarn: 0, cats: 5, pp: 0 },
      unlock: (s) => s.cats >= 5,
      onBuilt: (s) => { s.rates.yarn += 0.2; }, // +1/5s = 0.2/s
      meta: "ผลิตไหมพรม +0.2/วิ"
    },
    {
      id: "sushi",
      name: "Sushi Bar 🍣",
      desc: "ร้านซูชิแมว ทำปลาให้มีมูลค่า",
      buildTimeSec: 25,
      cost: { fish: 80, yarn: 10, cats: 8, pp: 2 },
      unlock: (s) => s.buildings.mill?.built >= 1,
      onBuilt: (s) => { s.rates.fish += 3; s.pp += 2; },
      meta: "ผลิตปลา +3/วิ, +2 PurrPoints"
    }
  ];

  const STORAGE_KEY = "catropolis_v1";

  const defaultState = () => ({
    fish: 10,
    yarn: 0,
    cats: 0,
    pp: 0,
    rates: { fish: 0, yarn: 0 },
    // building status
    buildings: Object.fromEntries(BUILDINGS.map(b => [b.id, { built: 0, building: null }])),
    // queue: at most 1 build at a time (simple)
    activeBuild: null, // { id, startAt, endAt }
    lastTick: now(),
    // produced-but-not-collected (optional click-to-collect feel)
    stash: { fish: 0, yarn: 0 },
    log: []
  });

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const s = JSON.parse(raw);
      // basic merge
      return Object.assign(defaultState(), s);
    } catch {
      return defaultState();
    }
  }

  function save(s) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  }

  function log(s, msg) {
    const t = new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
    s.log.unshift(`[${t}] ${msg}`);
    if (s.log.length > 60) s.log.length = 60;
  }

  function canPay(s, cost) {
    return (s.fish >= (cost.fish||0)) &&
           (s.yarn >= (cost.yarn||0)) &&
           (s.cats >= (cost.cats||0)) &&
           (s.pp >= (cost.pp||0));
  }

  function pay(s, cost) {
    s.fish -= (cost.fish||0);
    s.yarn -= (cost.yarn||0);
    s.cats -= (cost.cats||0);
    s.pp -= (cost.pp||0);
  }

  function format(n) {
    // simple nice format
    if (Math.abs(n) >= 1e9) return (n/1e9).toFixed(2) + "B";
    if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(2) + "M";
    if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(2) + "K";
    return (Math.round(n*100)/100).toString();
  }

  // ---------- Simulation ----------
  function applyOfflineProgress(s) {
    const t = now();
    const dt = Math.max(0, (t - (s.lastTick||t)) / 1000);

    // produce into stash (click-to-collect feel)
    s.stash.fish += s.rates.fish * dt;
    s.stash.yarn += s.rates.yarn * dt;

    s.lastTick = t;
  }

  function finishBuildIfReady(s) {
    if (!s.activeBuild) return false;
    if (now() < s.activeBuild.endAt) return false;

    const id = s.activeBuild.id;
    const def = BUILDINGS.find(x => x.id === id);
    s.buildings[id].built += 1;
    def.onBuilt?.(s);
    log(s, `สร้างเสร็จ: ${def.name} (รวม ${s.buildings[id].built}) ✅`);
    s.activeBuild = null;
    return true;
  }

  // ---------- UI ----------
  const el = (id) => document.getElementById(id);
  const fishEl = el("fish");
  const yarnEl = el("yarn");
  const catsEl = el("cats");
  const ppEl = el("pp");
  const fishRateEl = el("fishRate");
  const yarnRateEl = el("yarnRate");
  const logEl = el("log");
  const listEl = el("buildingList");
  const collectBtn = el("collectBtn");
  const resetBtn = el("resetBtn");
  const globalBar = el("globalBar");
  const globalProg = el("globalProg");
  const ratePill = el("ratePill");

  function render(s) {
    fishEl.textContent = format(s.fish);
    yarnEl.textContent = format(s.yarn);
    catsEl.textContent = format(s.cats);
    ppEl.textContent = format(s.pp);

    fishRateEl.textContent = `+${format(s.rates.fish)} / วิ (รอเก็บ: ${format(s.stash.fish)})`;
    yarnRateEl.textContent = `+${format(s.rates.yarn)} / วิ (รอเก็บ: ${format(s.stash.yarn)})`;

    ratePill.textContent = `รายได้: 🐟 +${format(s.rates.fish)}/วิ • 🧶 +${format(s.rates.yarn)}/วิ`;

    logEl.innerHTML = s.log.map(x => `<div>${escapeHtml(x)}</div>`).join("");

    // global build progress
    if (s.activeBuild) {
      const total = (s.activeBuild.endAt - s.activeBuild.startAt);
      const done = Math.min(total, Math.max(0, now() - s.activeBuild.startAt));
      const p = total ? (done / total) : 0;
      globalBar.style.width = (p*100).toFixed(1) + "%";
      const def = BUILDINGS.find(b => b.id === s.activeBuild.id);
      const remain = Math.max(0, Math.ceil((s.activeBuild.endAt - now())/1000));
      globalProg.textContent = `กำลังก่อสร้าง: ${def.name} • เหลือ ${remain} วิ`;
    } else {
      globalBar.style.width = "0%";
      globalProg.textContent = `ไม่มีงานก่อสร้าง`;
    }

    // building list
    listEl.innerHTML = "";
    for (const b of BUILDINGS) {
      const built = s.buildings[b.id]?.built || 0;
      const unlocked = b.unlock(s);
      const busy = !!s.activeBuild;
      const can = unlocked && !busy && canPay(s, b.cost);

      const costStr = [
        b.cost.fish ? `🐟${b.cost.fish}` : null,
        b.cost.yarn ? `🧶${b.cost.yarn}` : null,
        b.cost.cats ? `🐾${b.cost.cats}` : null,
        b.cost.pp ? `⭐${b.cost.pp}` : null,
      ].filter(Boolean).join(" ");

      const div = document.createElement("div");
      div.className = "b";
      div.innerHTML = `
        <div class="left">
          <div class="name">${b.name} <span class="tiny">x${built}</span></div>
          <div class="desc">${b.desc}</div>
          <div class="meta">⏳ สร้าง ${b.buildTimeSec} วิ • ค่าใช้จ่าย: ${costStr || "ฟรี"} • ${b.meta}</div>
          ${!unlocked ? `<div class="tiny">🔒 ยังไม่ปลดล็อก</div>` : ``}
        </div>
        <div style="display:flex; flex-direction:column; gap:8px; min-width:140px; align-items:flex-end;">
          <button ${can ? "" : "disabled"} data-build="${b.id}">${busy ? "กำลังก่อสร้าง..." : "สร้าง"}</button>
          <button class="ghost" data-info="${b.id}">รายละเอียด</button>
        </div>
      `;
      listEl.appendChild(div);
    }

    // collect button enabled?
    const hasStash = (s.stash.fish >= 1e-6) || (s.stash.yarn >= 1e-6);
    collectBtn.disabled = !hasStash;
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, (m) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
  }

  // ---------- Actions ----------
  function startBuild(s, id) {
    if (s.activeBuild) return;
    const def = BUILDINGS.find(b => b.id === id);
    if (!def) return;
    if (!def.unlock(s)) return;
    if (!canPay(s, def.cost)) return;

    pay(s, def.cost);
    const t = now();
    s.activeBuild = { id, startAt: t, endAt: t + def.buildTimeSec*1000 };
    log(s, `เริ่มสร้าง: ${def.name} (รอ ${def.buildTimeSec} วิ) 🏗️`);
  }

  function collect(s) {
    const f = s.stash.fish;
    const y = s.stash.yarn;
    if (f <= 0 && y <= 0) return;

    s.fish += f;
    s.yarn += y;

    const msg = `เก็บของ: 🐟+${format(f)} 🧶+${format(y)} 🎒`;
    s.stash.fish = 0;
    s.stash.yarn = 0;
    log(s, msg);
  }

  function resetAll() {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }

  // ---------- Main Loop ----------
  let state = load();
  // init: if player has never built pond, give them a hint
  if ((state.buildings.pond?.built || 0) === 0) {
    log(state, "เริ่มต้น: กดสร้าง Fish Pond 🐟 เพื่อให้เมืองมีรายได้!");
  }

  // apply offline progress immediately
  applyOfflineProgress(state);
  finishBuildIfReady(state);
  save(state);
  render(state);

  // event delegation
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;

    if (btn.id === "collectBtn") {
      applyOfflineProgress(state);
      collect(state);
      save(state);
      render(state);
      return;
    }
    if (btn.id === "resetBtn") {
      if (confirm("รีเซ็ตทั้งหมด?")) resetAll();
      return;
    }

    const buildId = btn.getAttribute("data-build");
    const infoId = btn.getAttribute("data-info");

    if (buildId) {
      applyOfflineProgress(state);
      finishBuildIfReady(state);
      startBuild(state, buildId);
      save(state);
      render(state);
    }
    if (infoId) {
      const def = BUILDINGS.find(b => b.id === infoId);
      const built = state.buildings[infoId]?.built || 0;
      alert(`${def.name}\n\n${def.desc}\n\nสร้าง: ${def.buildTimeSec} วิ\nมีแล้ว: x${built}\n\nผล: ${def.meta}`);
    }
  });

  // tick loop (smooth progress + offline stash)
  setInterval(() => {
    applyOfflineProgress(state);
    const done = finishBuildIfReady(state);
    // autosave occasionally or when build finishes
    if (done) save(state);
    render(state);
  }, 250);

  // save every 5s
  setInterval(() => save(state), 5000);
})();
</script>
</body>
</html>
